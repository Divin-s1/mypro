<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruits - Nyanza Modern Fruit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{
    background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                url("r.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    animation: bgMove 20s infinite alternate;
}


@keyframes bgMove{
    0%{background-position:0% 0%;}
    100%{background-position:50% 50%;}
}


.header{
    background: linear-gradient(90deg, rgb(33, 166, 3), rgb(10, 120, 20));
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    color:white;

    animation: slideDown 1s ease;
}

@keyframes slideDown{
    from{transform:translateY(-100%); opacity:0;}
    to{transform:translateY(0); opacity:1;}
}

.header h1{
    font-family:cursive;
}


.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav a{
    text-decoration:none;
    color:white;
    padding:10px;
    background:rgba(0,0,0,0.2);
    border-radius:8px;
    font-family:cursive;
    transition:0.3s;
}

.nav a:hover{
    background:white;
    color:green;
    transform:scale(1.1);
}


.title{
    text-align:center;
    padding:20px;
    color:white;
    animation: fadeIn 2s ease;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}


.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
}


.card{
    background:rgba(255,255,255,0.95);
    padding:15px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);

    transition:0.4s;
    animation: popIn 0.8s ease;
}

@keyframes popIn{
    from{transform:scale(0.5); opacity:0;}
    to{transform:scale(1); opacity:1;}
}

.card:hover{
    transform:translateY(-10px) scale(1.05);
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:10px;
}


.price{
    font-weight:bold;
    color:green;
}


.btn{
    margin-top:10px;
    padding:10px;
    background:green;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:darkgreen;
    transform:scale(1.05);
}


#orderForm{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    animation: fadeIn 0.5s ease;
}

.form-box{
    background:white;
    padding:20px;
    width:300px;
    border-radius:12px;
    text-align:center;
    animation: popIn 0.4s ease;
}

.form-box input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

.form-box button{
    padding:10px;
    width:100%;
    border:none;
    border-radius:8px;
    background:green;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

.form-box button:hover{
    transform:scale(1.05);
}

.close{
    background:red;
    margin-top:5px;
}


#msg{
    text-align:center;
    color:white;
    font-weight:bold;
    margin-top:10px;
    animation: fadeIn 1s ease;
}


.footer{
    background:green;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:20px;
    animation: slideUp 1s ease;
}

@keyframes slideUp{
    from{transform:translateY(100%); opacity:0;}
    to{transform:translateY(0); opacity:1;}
}
</style>

</head>

<body>

<div class="header">
    <h1>NYANZA MODERN FRUIT CENTER</h1>

    <div class="nav">
        <a href="index.html">Home</a>
        <a href="fruits.html">Fruits</a>
        <a href="sellers.html">Sellers</a>
        <a href="customers.html">Customers</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<div class="title">
    <h2>Fresh Fruits Market 🍍🍌🍉</h2>
</div>

<p id="msg"></p>


<div class="grid">

    <div class="card">
        <img src="apple.png">
        <h3>Apples</h3>
        <p class="price">500 RWF / kg</p>
        <button class="btn" onclick="openForm('Apples')">Buy Now</button>
    </div>

    <div class="card">
        <img src="orange.png">
        <h3>Oranges</h3>
        <p class="price">700 RWF / kg</p>
        <button class="btn" onclick="openForm('Oranges')">Buy Now</button>
    </div>

    <div class="card">
        <img src="Screenshot 2026-05-12 103002.png">
        <h3>Bananas</h3>
        <p class="price">400 RWF / kg</p>
        <button class="btn" onclick="openForm('Bananas')">Buy Now</button>
    </div>

    <div class="card">
        <img src="mango.png">
        <h3>Mangoes</h3>
        <p class="price">1000 RWF / kg</p>
        <button class="btn" onclick="openForm('Mangoes')">Buy Now</button>
    </div>

</div>


<div id="orderForm">
    <div class="form-box">
        <h3>Delivery Form 📦</h3>

        <input type="text" id="name" placeholder="Your Name">
        <input type="text" id="location" placeholder="Where do you live?">
        <input type="text" id="phone" placeholder="Phone Number">

        <button onclick="submitOrder()">Submit Order</button>
        <button class="close" onclick="closeForm()">Close</button>
    </div>
</div>


<div class="footer">
    <h3>NYANZA MODERN FRUIT</h3>
    <p>Fresh • Healthy • Natural Fruits</p>
</div>

<script>
let selectedFruit = "";

function openForm(fruit){
    selectedFruit = fruit;
    document.getElementById("orderForm").style.display = "flex";
}

function closeForm(){
    document.getElementById("orderForm").style.display = "none";
}

function submitOrder(){
    let name = document.getElementById("name").value;
    let location = document.getElementById("location").value;
    let phone = document.getElementById("phone").value;

    if(name === "" || location === "" || phone === ""){
        alert("Please fill all fields!");
        return;
    }

    let time = Math.floor(Math.random() * 30) + 10;

    document.getElementById("msg").innerText =
        "✅ Order confirmed for " + selectedFruit +
        " | Delivery: " + time + " mins to " + location;

    document.getElementById("orderForm").style.display = "none";
}
</script>

</body>
</html>
