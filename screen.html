<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Screen - Nyanza Modern Fruit</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:url("r.png");
    background-size:cover;
    background-position:center;
}


.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}


.splash{
    position:relative;
    z-index:10;
    text-align:center;
    color:white;
    animation:zoomIn 2s ease;
}


.splash img{
    width:130px;
    height:130px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    animation:spin 5s linear infinite;
}


.splash h1{
    margin-top:20px;
    font-size:40px;
    font-family:cursive;
    background:linear-gradient(90deg,yellow,orange,lime,cyan,pink);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:glow 2s infinite alternate;
}

.splash p{
    margin-top:10px;
    font-size:18px;
    letter-spacing:2px;
    animation:fade 2s infinite;
}


.loader{
    margin:25px auto;
    width:70px;
    height:70px;
    border:8px solid rgba(255,255,255,0.3);
    border-top:8px solid lime;
    border-radius:50%;
    animation:rotate 1s linear infinite;
}


@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 30px lime;
    }
}

@keyframes fade{
    0%{
        opacity:0.3;
    }
    50%{
        opacity:1;
    }
    100%{
        opacity:0.3;
    }
}

@keyframes zoomIn{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="splash">

    <img src="QQ.png" alt="Logo">

    <h1>NYANZA MODERN FRUIT</h1>

    <p>Fresh • Healthy • Natural Fruits</p>

    <div class="loader"></div>

</div>

<script>



setTimeout(function(){

    window.location.href = "gate.html";

},5000);

</script>

</body>
</html>
